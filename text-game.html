<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Manipulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        input, button {
            padding: 10px;
            margin-top: 10px;
        }
        .output-section {
            margin-top: 20px;
            white-space: pre-wrap; /* Ensure text wraps in <pre> */
        }
        .output-section pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .copy-button {
            margin-top: 10px;
            padding: 10px;
            cursor: pointer;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .copy-button:hover {
            background-color: #0056b3;
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
                color: #e0e0e0;
            }
        }
    </style>
</head>
<body>
    <h1>Text Manipulation</h1>
    <input type="text" id="userInput" placeholder="Enter a string">
    <button onclick="processInput()">Process</button>

    <div class="output-section" id="output"></div>
    <button class="copy-button" onclick="copyToClipboard()">Copy to Clipboard</button>

    <hr style="margin-top: 30px;">

    <h1>Substitutions</h1>
    <textarea id="subInput" rows="8" style="width: 100%; box-sizing: border-box; padding: 10px; margin-top: 10px;" placeholder="Paste text here (Ctrl/Cmd+Enter to process)"></textarea>
    <br>
    <button onclick="processSubstitutions()">Process</button>

    <div class="output-section" id="subOutput"></div>
    <button class="copy-button" onclick="copySubstitutions()">Copy to Clipboard</button>

    <script>
        // Add "Enter" key functionality
        document.getElementById('userInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                processInput(); // Call the function when Enter is pressed
            }
        });

        function processInput() {
            const userInput = document.getElementById('userInput').value;

            // Reverse the text
            const reversedInput = userInput.split('').reverse().join('');

            // Apply character substitutions to the reversed text
            const invertedInput = invertText(reversedInput);

            // Transform words based on their length
            const transformedWords = transformWords(userInput);

            // Update the output section
            const outputSection = document.getElementById('output');
            outputSection.innerHTML = ''; // Clear previous output
            outputSection.append(createPre(userInput));
            outputSection.append(createPre(reversedInput));
            outputSection.append(createPre(invertedInput));

            // Add "Mids: " before the fourth output
            outputSection.append(createPre("Mids: " + transformedWords));
        }

        function invertText(input) {
            const substitutionMap = {
                // Numbers
                '0': '0', '1': '⇂', '2': 'ᘔ', '3': 'Ɛ', '4': 'ㄣ', '5': 'ϛ', '6': '9', '7': 'ㄥ', '8': '8', '9': '6',

                // Lowercase Letters
                'a': 'e', 'b': 'q', 'c': 'ɔ', 'd': 'p', 'e': 'a', 'f': 'ɟ', 'g': 'b', 'h': 'ɥ', 'i': '!', 'j': 'ſ', 'k': 'ʞ', 'l': 'l', 'm': 'w', 'n': 'u', 'o': 'o', 'p': 'd', 'q': 'b', 'r': 'ɹ', 's': 's', 't': '+', 'u': 'n', 'v': 'ʌ', 'w': 'm', 'x': 'x', 'y': 'ʎ', 'z': 'z',

                // Uppercase Letters
                'A': '∀', 'B': 'q', 'C': 'Ɔ', 'D': 'P', 'E': 'Ǝ', 'F': 'Ⅎ', 'G': '⅁', 'H': 'H', 'I': 'I', 'J': 'ſ', 'K': 'ʞ', 'L': '⅂', 'M': 'W', 'N': 'N', 'O': 'O', 'P': 'Ԁ', 'Q': 'Ό', 'R': 'ꓤ', 'S': 'S', 'T': '⊥', 'U': '∩', 'V': 'Λ', 'W': 'M', 'X': 'X', 'Y': '⅄', 'Z': 'Z',

                // Special Characters
                ',': "'", "'": ',', '"': '„', '!': 'i', '(': ')', ')': '(', '[': ']', ']': '[', '{': '}', '}': '{', '&': '⅋'
            };

            let invertedText = '';
            for (let i = 0; i < input.length; i++) {
                const char = input[i];
                invertedText += substitutionMap[char] || char; // Use substitution map or leave the character as is
            }
            return invertedText;
        }

        function transformWords(input) {
            // Split the input into words
            const words = input.split(/\s+/);

            // Transform each word based on its length
            const transformed = words.map(word => {
                // Remove punctuation at the start and end of the word
                const strippedWord = word.replace(/^[^\w]+|[^\w]+$/g, '');

                if (strippedWord.length <= 2) {
                    return word; // Keep as is
                } else if (strippedWord.length >= 3 && strippedWord.length <= 5) {
                    return word.slice(1, -1); // Remove first and last character
                } else if (strippedWord.length >= 6) {
                    return word.slice(2, -2); // Remove first two and last two characters
                }
                return word; // Default case (shouldn't happen)
            });

            // Join the transformed words back into a string
            return transformed.join(' ');
        }

        function createPre(text) {
            const pre = document.createElement('pre');
            pre.innerText = text;
            return pre;
        }

        function copyToClipboard() {
            // Get all the output text
            const outputSection = document.getElementById('output');
            const textToCopy = Array.from(outputSection.querySelectorAll('pre'))
                .map(pre => pre.innerText)
                .join('\n'); // Combine all <pre> blocks into one string with newlines

            // Copy to clipboard
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy to clipboard.');
            });
        }

        // Substitutions section: plain Enter adds a newline, Ctrl/Cmd+Enter processes
        document.getElementById('subInput').addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
                processSubstitutions();
            }
        });

        // [find, replacement] pairs, applied in order to the whole text. Add new rules to this list.
        const substitutions = [
            ['year', '**year**/~~hear/ear~~'],
            ['now', '**now**/==now=='],
            ['today', '**today**/==to==__day__'],
            ['there are', 'there are/==~~here~~==/~~hear ear~~/~~rear~~)'],
            ['there', 't==~~here~~==/~~hear ear~~/__air__'],
            ['where', 'w==~~here~~==/~~hear ear~~'],
            ['ancient', '==~~<<ancient~~==/__==ancient==__'],
            ['legend', '__==legend==__/leg==~~end>>~~==/==legend=='],
            ['drinking', 'dr~~ink~~/__==ki==__/ing'],
            ['thousand', '==~~<<k-thousand~~==/house and/do-us-use-and'],
            ['single', '__==sin==__gle/~~sing~~le/__single__'],
            ['made', 'm==aid==/made'],
            ['even', '~~eve~~n/==even=='],
            ['forward', '==for==~~ward-word~~/==~~forward>>~~==/==to==~~ward~~'],
            ['toward', '==to==~~ward-word~~/==~~torward>>~~==/==for==~~ward~~'],
            ['east', '==~~east>>~~=='],
            ['start', '__==star==__/__start__/==~~<<start~~=='],
            ['red', '__red__'],
            ['der', '__der__'],
            ['read', '__read__'],
            ['Phoenician', '__Phoenician__'],
            ['son', '__son__'],
            ['light', '__light__'],
            ['lite', '__lite__'],
            ['dot', '__dot__'],
            ['regard', '__regard__'],
            ['look', '__look__'],
            ['r ed', '__r ed__'],
            ['day', '__day__'],
            ['north', '__north__'],
            ['up', '__up__'],
            ['rise', '__rise__'],
            ['spec', '__spec__'],
            ['one', '__one__'],
            ['point', '__point__'],
            ['like', '__like 👍__'],
            ['Phoenician', '__Phoenician__'],
            ['symbol', '__==symbol==__/simple'],
            ['simple', 'simple/__==symbol==__'],
            ['key', '__==key==__'],
            ['he k', '__==he k-key==__'],
            ['eek', '__==eek-key==__'],
            ['kee', '__==kee-key==__'],
            ['sin', '__==sin==__'],
            ['s in', '__==s in==__'],
            ['sign', '__==sign==__'],
            ['science', '__==science==__'],
            ['ten', '__==ten==__'],
            ['ex', '__==ex==__'],
            ['que', '__==que==__'],
            ['middle', '__==middle==__'],
            ['more', '==more=='],  
            ['with', '==with=='], 
            ['aim', '==aim=='],  
            ['some', '==some=='],
            ['cross', '==cross==/__==cross==__ '],
            ['star', '==star==/__==star==__ '],
            ['so m', '==so m=='],
            ['cum', '==cum=='], 
            ['com', '==com=='],
            ['and', '==and=='],
            ['also', '==also=='],
            ['for', '==for=='],
            ['just', '==~~<<just>>~~==/==just=='],
            ['to', '==to=='],
            ['over', '~~over~~/==~~over~~=='],
            ['secret', '~~secret~~'],
            ['under', 'un__der__/~~under~~'],
            ['scribe', '~~scribe~~'],
            ['ward', '~~ward~~'],
            ['word', '~~word~~'],
            ['ear', '~~ear~~'],
            ['ring', '~~ring~~'],
            ['ding', '~~ding~~'],
            ['round', '~~round~~'],
            ['from', '~~from~~'],
            ['descen', '~~descen~~'],
            ['down', '~~down~~'],
            ['south', '~~south~~'],
            ['night', '~~night~~'],
            ['all', '~~all~~'],
            ['disc', '~~disc~~'],
            ['under', '~~under~~/un__der__'],
            ['that said', '**that said**'],
            ['link', '**link**'],
            ['name', '**name**'],
            ['each', '**each**'],
            ['nic', '**nic**/__==k cin-sign==__'],
            ['time', '**time**/__==times==__'],
            ['but', '==~~<<back-end-but>>~~=='],            
            ['end', '==~~end>>~~=='],
            ['ass', '==~~ass>>~~=='],
            ['west', '==~~<<west~~=='],
            ['back', '==~~<<back~~=='] 
        ];

        // Each replacement is swapped for one placeholder character while the rules run, so no later rule can match inside an earlier replacement. Replacements already in the pasted text are hidden first, so repeat pastes never nest.
        function applySubstitutions(text) {
            const tokens = new Map();
            const tokenFor = replacement => {
                if (!tokens.has(replacement)) tokens.set(replacement, String.fromCharCode(0xE000 + tokens.size));
                return tokens.get(replacement);
            };
            let result = text;
            substitutions.map(([, replacement]) => replacement)
                .sort((a, b) => b.length - a.length)
                .forEach(replacement => { result = result.split(replacement).join(tokenFor(replacement)); });
            substitutions.forEach(([find, replacement]) => {
                const token = tokenFor(replacement);
                result = result.replace(new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), () => token);
            });
            const restore = new Map([...tokens].map(([replacement, token]) => [token, replacement]));
            return result.replace(/[-]/g, char => restore.get(char) || char);
        }

        function processSubstitutions() {
            const subInput = document.getElementById('subInput').value;
            const subResult = applySubstitutions(subInput);

            const subOutput = document.getElementById('subOutput');
            subOutput.innerHTML = '';
            subOutput.append(createPre(subResult));
        }

        function copySubstitutions() {
            const subOutput = document.getElementById('subOutput');
            const textToCopy = Array.from(subOutput.querySelectorAll('pre'))
                .map(pre => pre.innerText)
                .join('\n');

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy: ', err);
                alert('Failed to copy to clipboard.');
            });
        }
    </script>
</body>
</html>
